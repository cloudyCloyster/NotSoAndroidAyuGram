name: Build release APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update packages
        run: sudo apt-get update

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v2

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Find and run gradlew to build debug APK
        # This step finds the first gradlew in the repo, makes it executable, and runs it.
        run: |
          set -e
          echo "Looking for gradlew in repository..."
          GRADLEW_PATH=$(find . -type f -name gradlew | head -n 1 || true)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found in repository."
            echo "Contents of repo root:"
            ls -la
            exit 1
          fi
          echo "Found gradlew at: $GRADLEW_PATH"
          chmod +x "$GRADLEW_PATH"
          echo "Running gradlew to build debug APK for TMessagesProj..."
          # Use -p TMessagesProj to run the build for that module regardless of wrapper location
          "$GRADLEW_PATH" -p TMessagesProj assembleDebug --no-daemon --console=plain

      - name: Show build outputs for debugging
        run: |
          echo "Listing APK output directories:"
          ls -R TMessagesProj/**/build/outputs/apk || true
          echo "Listing any APK files found:"
          find TMessagesProj -type f -name "*.apk" -print || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Release APK
          path: TMessagesProj/**/build/outputs/apk/**/*.apk
