name: Build release APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # NOTE: Removed base64 -> file steps (google-services.json and keystore)
      # so this workflow does NOT require any repository secrets.

      - name: Update packages
        run: sudo apt-get update

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v2

      - name: Prepare Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Grant execute permission for gradlew
        run: chmod +x TMessagesProj/gradlew

      - name: Build debug APK (in TMessagesProj)
        working-directory: TMessagesProj
        run: ./gradlew assembleDebug --no-daemon --console=plain

      - name: Show build outputs for debugging
        run: |
          echo "Listing APK output directories:"
          ls -R TMessagesProj/**/build/outputs/apk || true
          echo "Listing any APK files found:"
          find TMessagesProj -type f -name "*.apk" -print || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Release APK
          # robust glob: find APKs anywhere under the Android project
          path: TMessagesProj/**/build/outputs/apk/**/*.apk
